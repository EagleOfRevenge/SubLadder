# SubLadder Nginx reverse proxy
# Copy this file to /etc/nginx/sites-available/subladder.conf and replace the server_name
# values and TLS paths with your real domain.

upstream subladder_api {
    server 127.0.0.1:8000;
    keepalive 32;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    listen [::]:80;
    server_name dedicated-zap1280014-1.zap-srv.com;

    client_max_body_size 20m;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dedicated-zap1280014-1.zap-srv.com;

    ssl_certificate /etc/letsencrypt/live/dedicated-zap1280014-1.zap-srv.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dedicated-zap1280014-1.zap-srv.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    client_max_body_size 20m;

    location / {
        proxy_pass http://subladder_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
    }
}

